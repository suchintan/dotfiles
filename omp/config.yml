modelRoles: 
  codex: openai-codex/gpt-5.6-sol:xhigh
  codex_review: openai-codex/gpt-5.6-sol:xhigh
  default: anthropic/claude-fable-5:max
defaultThinkingLevel: max
hideThinkingBlock: true
omitThinking: true
personality: pragmatic
tools: 
  approvalMode: yolo
task: 
  agentModelOverrides: 
    task: "@codex"
    reviewer: "@codex_review"
    security-reviewer: "@codex_review"
    scout: "@codex"
    sonic: "@codex"
    librarian: "@codex"
compaction: 
  thresholdPercent: 90
  thresholdTokens: 400000
symbolPreset: unicode
theme: 
  dark: titanium
colorBlindMode: true
statusLine: 
  preset: custom
  separator: powerline-thin
  leftSegments: 
    - model
    - path
  rightSegments: 
    - context_pct
    - usage
  segmentOptions: 
    model: 
      showThinkingLevel: true
    path: 
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
setupVersion: 1
dev: 
  autoqaConsent: denied
browser: 
  relay: true