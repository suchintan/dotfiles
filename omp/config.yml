modelRoles:
  codex: openai-codex/gpt-5.6-luna:xhigh
  codex_control: openai-codex/gpt-5.6-sol:xhigh
  codex_treatment: openai-codex/gpt-5.6-luna:xhigh
  codex_treatment_max: openai-codex/gpt-5.6-luna:max
  codex_review: openai-codex/gpt-5.6-sol:xhigh
  default: openai-codex/gpt-5.6-sol:xhigh
defaultThinkingLevel: xhigh
hideThinkingBlock: true
omitThinking: true
personality: pragmatic
tools: 
  approvalMode: yolo
task: 
  agentModelOverrides: 
    task: "@codex_treatment"
    reviewer: "@codex_review"
    security-reviewer: "@codex_review"
    scout: "@codex_treatment"
    sonic: "@codex_treatment"
    librarian: "@codex_treatment"
compaction: 
  thresholdPercent: 90
  thresholdTokens: 400000
symbolPreset: unicode
theme: 
  dark: titanium
colorBlindMode: true
statusLine: 
  preset: custom
  separator: powerline-thin
  leftSegments: 
    - model
    - path
    - pr
  rightSegments: 
    - context_pct
    - token_total
    - cost
    - usage
  segmentOptions: 
    model: 
      showThinkingLevel: true
    path: 
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
setupVersion: 1
dev: 
  autoqaConsent: denied
browser: 
  relay: true
codexResets: 
  autoRedeem: "yes"
gc: 
  coldArchiveAfterDays: 365
  retainNewestGlobal: 500
  retainNewestPerCwd: 100